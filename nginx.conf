# Client address as Caddy (the front proxy on the host) reports it; without Caddy, the socket's.
map $http_x_forwarded_for $client_ip {
    default $http_x_forwarded_for;
    ""      $remote_addr;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's own resolver, so the api can restart (and change address) without breaking us.
    resolver 127.0.0.11 valid=10s;

    # Nothing public takes more than a short JSON body.
    client_max_body_size 64k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    # $http_host keeps the port the visitor used; the api compares it with the request's Origin.
    proxy_set_header Host $http_host;
    proxy_set_header X-Client-IP $client_ip;
    proxy_read_timeout 90s;

    # Hashed build assets never change; index.html must always revalidate.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The published catalog is written by the api into a shared directory. The list changes
    # whenever a work is approved; each cover's address carries a hash of its content.
    location = /catalog/published.json {
        alias /srv/catalog/published.json;
        add_header Cache-Control "no-cache";
    }
    location /catalog/shots/ {
        alias /srv/catalog/shots/;
        add_header Cache-Control "public, max-age=2592000";
    }

    # The reviewer's pages and api. The password file is mounted from the server, never committed.
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        auth_basic "Archipelago admin";
        auth_basic_user_file /etc/nginx/secrets/admin.htpasswd;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'none'";
        try_files $uri $uri/ /admin/index.html;
    }
    location /api/admin/ {
        auth_basic "Archipelago admin";
        auth_basic_user_file /etc/nginx/secrets/admin.htpasswd;
        set $api http://api:3000;
        proxy_pass $api;
    }

    # Visitors: submit a work and follow its progress.
    location /api/ {
        set $api http://api:3000;
        proxy_pass $api;
    }

    # The worker talks to the api over the private docker network, never through here.
    location /internal/ {
        return 404;
    }

    location = /submit {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'none'";
        try_files /submit.html =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
